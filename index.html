<!-- ================= ADD THIS JS ================= -->

<script>
function sendMessage(){
  let input=document.getElementById("userInput");
  let chat=document.getElementById("chatBox");

  let text=input.value.trim();
  if(!text) return;

  chat.innerHTML+=`<div class="user-message">${text}</div>`;

  let reply="She builds AI systems, RAG pipelines and ML solutions.";

  if(text.toLowerCase().includes("project"))
    reply="She built 11+ projects including AI agents, sentiment analysis, and ML threat detection.";

  if(text.toLowerCase().includes("skills"))
    reply="Python, FastAPI, React, AWS, NLP, Machine Learning, Vector DBs.";

  if(text.toLowerCase().includes("ai"))
    reply="She focuses on Generative AI, LLM systems, and multi-agent architectures.";

  chat.innerHTML+=`<div class="ai-message">${reply}</div>`;

  input.value="";
  chat.scrollTop=chat.scrollHeight;
}
</script>
